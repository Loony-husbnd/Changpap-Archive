<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>창팝 아카이브</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="./">창팝 <span>아카이브</span></a>
  <input id="q" type="search" placeholder="제목, 태그 검색" autocomplete="off">
  <select id="sort" aria-label="정렬">
    <option value="new">최신순</option>
    <option value="title">제목순</option>
    <option value="long">긴 영상순</option>
  </select>
</header>

<main>
  <section id="player-wrap" hidden>
    <div class="stage">
      <video id="video" controls playsinline preload="metadata"></video>
    </div>
    <div class="info">
      <h1 id="p-title"></h1>
      <p id="p-meta"></p>
      <div class="tools">
        <label>속도
          <select id="rate">
            <option value="0.25">0.25×</option><option value="0.5">0.5×</option>
            <option value="0.75">0.75×</option><option value="1" selected>1×</option>
            <option value="1.25">1.25×</option><option value="1.5">1.5×</option>
            <option value="2">2×</option>
          </select>
        </label>
        <label><input type="checkbox" id="loop"> 반복</label>
        <label><input type="checkbox" id="mirror"> 좌우반전</label>
        <button id="ab" type="button">구간반복 A–B</button>
        <span id="ab-state"></span>
      </div>
      <p class="keys">단축키: Space 재생/정지 · ←/→ 5초 · J/L 10초 · ,/. 프레임 · [ ] 속도 · M 음소거 · F 전체화면 · A 구간반복 · ESC 닫기</p>
    </div>
  </section>

  <div id="tags" class="tags"></div>
  <div id="grid" class="grid"></div>
  <p id="empty" hidden></p>
</main>
<script src="app.js"></script>
</body>
</html>
